name: Create Jira Issue from GitHub Issue

on:
  issues:
    types: [opened]

jobs:
  create-jira-issue:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Parse Issue Body and Send to Jira Automation
        uses: actions/github-script@v7
        env:
          JIRA_WEBHOOK_URL: ${{ secrets.JIRA_WEBHOOK_URL }}
          JIRA_WEBHOOK_TOKEN: ${{ secrets.JIRA_WEBHOOK_TOKEN }}

          STORY_ISSUE_TYPE_ID: ${{ vars.STORY_ISSUE_TYPE_ID }}
          BUG_ISSUE_TYPE_ID: ${{ vars.BUG_ISSUE_TYPE_ID }}

        with:
          script: |
            const webhookUrl = process.env.JIRA_WEBHOOK_URL;
            const webhookToken = process.env.JIRA_WEBHOOK_TOKEN;

            if (!webhookUrl) {
              throw new Error("JIRA_WEBHOOK_URL Secret이 설정되지 않았습니다.");
            }

            if (!webhookToken) {
              throw new Error("JIRA_WEBHOOK_TOKEN Secret이 설정되지 않았습니다.");
            }

            const body = context.payload.issue.body || '';
            const title = context.payload.issue.title || '';

            // GitHub Issue Form 파싱
            const get = (label, bodyText) => {
              const regex = new RegExp(
                `### ${label}\\s*\\n([\\s\\S]*?)(?=\\n###|$)`
              );
              const match = bodyText.match(regex);
              return match ? match[1].trim() : '';
            };

            const issueType   = get('⚡ 이슈 유형', body);
            const epicNumber  = get('🎟 상위 에픽 Number', body);
            const issueLabel  = get('🏷 레이블', body);
            const branchName  = get('🌿 브랜치명', body);
            const description = get('📌 이슈 설명', body);

            // Jira Issue Type ID 매핑
            const issueTypeMap = {
              Story: process.env.STORY_ISSUE_TYPE_ID,
              Bug: process.env.BUG_ISSUE_TYPE_ID
            };

            const issueTypeId = issueTypeMap[issueType];

            if (!issueTypeId) {
              throw new Error(
                `Jira Issue Type ID가 설정되지 않았습니다: ${issueType}`
              );
            }

            // 생성할 GitHub 브랜치명
            const newBranchName = `${epicNumber}-${branchName}`;

            console.log(`Branch to create: ${newBranchName}`);

            // 기본 브랜치 확인
            const repo = context.repo;

            const { data: repository } = await github.rest.repos.get({
              owner: repo.owner,
              repo: repo.repo
            });

            const defaultBranch = repository.default_branch;

            // 기본 브랜치의 최신 commit SHA 조회
            const { data: refData } = await github.rest.git.getRef({
              owner: repo.owner,
              repo: repo.repo,
              ref: `heads/${defaultBranch}`
            });

            const sha = refData.object.sha;

            // 브랜치 생성
            await github.rest.git.createRef({
              owner: repo.owner,
              repo: repo.repo,
              ref: `refs/heads/${newBranchName}`,
              sha
            });

            console.log(`Branch created: ${newBranchName}`);

            // Jira Automation으로 전송할 Payload
            const payload = {
              title,
              issueType,
              issueTypeId,
              epicNumber,
              issueLabel,
              branchName: newBranchName,
              description,
              githubIssueUrl: context.payload.issue.html_url,
              githubIssueNumber: context.payload.issue.number,
              actor: context.payload.sender.login
            };

            console.log(
              'Sending Payload:',
              JSON.stringify(payload, null, 2)
            );

            const response = await fetch(webhookUrl, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'X-Automation-Webhook-Token': webhookToken
              },
              body: JSON.stringify(payload)
            });

            console.log(
              'Jira Webhook Response Status:',
              response.status
            );

            const responseText = await response.text();

            console.log(
              'Jira Webhook Response:',
              responseText
            );

            if (!response.ok) {
              throw new Error(
                `Webhook 전송 실패 (${response.status}): ${responseText}`
              );
            }
