name: Create Jira Issue from GitHub Issue

on:
  issues:
    types: [opened]

jobs:
  create-jira-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      contents: read
    steps:
      - name: Parse Issue Body and Send to Jira Automation
        uses: actions/github-script@v7
        env:
          JIRA_WEBHOOK_URL: ${{ secrets.JIRA_WEBHOOK_URL }}
        with:
          script: |
            const webhookUrl = process.env.JIRA_WEBHOOK_URL;
            if (!webhookUrl) {
              throw new Error("JIRA_WEBHOOK_URL Secret이 설정되지 않았습니다.");
            }

            const body = context.payload.issue.body || '';
            const title = context.payload.issue.title || '';

            // 유연해진 H3 헤더 기반 파싱 함수
            const get = (label, bodyText) => {
              // ### 라벨 구문 뒤의 빈줄/공백을 유연하게 처리
              const regex = new RegExp(`###\\s*${label}\\s*\\n+([\\s\\S]*?)(?=\\n+###|$)`);
              const match = bodyText.match(regex);
              return match ? match[1].trim() : '';
            };

            const issueType    = get('⚡ 이슈 유형', body);
            const epicNumber   = get('🎟 상위 에픽 Number', body);
            const issueLabel   = get('🏷 레이블', body);
            const branchName   = get('🌿 브랜치명', body);
            const description  = get('📌 이슈 설명', body);

            const payload = {
              title,
              issueType,
              epicNumber,
              issueLabel,
              branchName,
              description,
              githubIssueUrl: context.payload.issue.html_url,
              githubIssueNumber: context.payload.issue.number,
              actor: context.payload.sender.login
            };

            console.log('Parsed Payload:', JSON.stringify(payload, null, 2));

            const response = await fetch(webhookUrl, {
              method: 'POST',
              headers: { 
                'Content-Type': 'application/json',
                'Accept': 'application/json'
              },
              body: JSON.stringify(payload)
            });

            console.log('Jira Webhook Response Status:', response.status);

            if (!response.ok) {
              const errorText = await response.text();
              throw new Error(`Webhook 전송 실패 (${response.status}): ${errorText}`);
            }
