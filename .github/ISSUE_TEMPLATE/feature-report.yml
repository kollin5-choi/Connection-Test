name: Feature Request
description: 새로운 기능 요청 및 JIRA 연동 이슈 작성
title: "[Feat] "
labels: []
body:
  - type: dropdown
    id: issue_type
    attributes:
      label: ⚡ 이슈 유형
      description: JIRA에서 생성될 이슈 유형을 선택하세요.
      options:
        - Story
        - Chore
        - Bug
    validations:
      required: true

  - type: input
    id: epic_number
    attributes:
      label: 🎟 상위 에픽 Number
      placeholder: e.g. WFP-12
      description: JIRA의 상위 이슈(에픽) 번호를 입력하세요.
    validations:
      required: true

  - type: input
    id: issue_label
    attributes:
      label: 🏷 레이블
      placeholder: e.g. FE, Refactor
      description: JIRA 이슈 세부 사항에 기재될 레이블 목록입니다. (쉼표로 구분)
    validations:
      required: false

  - type: input
    id: branch_name
    attributes:
      label: 🌿 브랜치명
      placeholder: e.g. login-page
      description: 해당 이슈를 작업할 브랜치 이름입니다. (develop에서 분기될 브랜치명)
    validations:
      required: true

  - type: textarea
    id: issue_description
    attributes:
      label: 📌 이슈 설명
      placeholder: 이슈에 대한 상세 설명을 입력하세요.
      description: JIRA 이슈 본문에 들어갈 내용입니다.
    validations:
      required: true
